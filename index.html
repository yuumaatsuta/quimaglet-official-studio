<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>QUIMAGLET OFFICIAL STUDIO</title>
    <meta name="description" content="QUIMAGLET OFFICIAL STUDIO" />
    <!-- ファビコンとサムネイル（SNS で共有したときの画像）は管理画面で替えられる（backend/ の /site/favicon・/site/og-image） -->
    <link rel="icon" type="image/png" href="https://quimaglet-api.quimaglet.workers.dev/site/favicon" />
    <link rel="apple-touch-icon" href="https://quimaglet-api.quimaglet.workers.dev/site/favicon" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="QUIMAGLET OFFICIAL STUDIO" />
    <meta property="og:title" content="QUIMAGLET OFFICIAL STUDIO" />
    <meta property="og:description" content="QUIMAGLET OFFICIAL STUDIO" />
    <meta property="og:url" content="https://yuumaatsuta.github.io/quimaglet-official-studio/" />
    <meta property="og:image" content="https://quimaglet-api.quimaglet.workers.dev/site/og-image" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://quimaglet-api.quimaglet.workers.dev/site/og-image" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- 奥の壁の落書きメニューの字体（src/wallMenu.js） -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Permanent+Marker&display=block" />
    <!-- About の画面いっぱいの文字（src/aboutView.js） -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@400;700;900&display=swap" />
    <!-- Goods の紙のメニューの手書きの字（src/goodsPaper.js）。英数字は Caveat、日本語は Yomogi -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Yomogi&display=swap" />
    <script type="module" crossorigin src="/quimaglet-official-studio/assets/index-Cu3QP84u.js"></script>
    <link rel="stylesheet" crossorigin href="/quimaglet-official-studio/assets/index-DfaDFym9.css">
  </head>
  <body>
    <div id="boot" class="boot">
      <p id="boot-label">LOADING... 0%</p>
    </div>

    <div id="app"></div>

    <div class="backdrop" aria-hidden="true">
      <div class="fade fade-top"></div>
      <div class="fade fade-bottom"></div>
    </div>

    <header class="site-header">
      <a class="logo" href="#"
        ><img class="logo-day" src="/quimaglet-official-studio/assets/logo-black-BRbM_xzb.png" alt="QUIMAGLET" width="241" height="260" /><img
          class="logo-night"
          src="/quimaglet-official-studio/assets/logo-CR8sEIM8.png"
          alt=""
          aria-hidden="true"
          width="241"
          height="260"
      /></a>
      <nav class="nav" aria-label="メニュー">
        <button type="button" data-open="about">About</button>
        <button type="button" data-open="works">Works</button>
        <button type="button" data-open="news">News</button>
        <button type="button" data-open="goods">Goods</button>
        <button type="button" data-open="contact">Contact</button>
      </nav>
      <!-- 天気パネルを開く（src/weatherPanel.js。パネルを使わない設定なら hidden のまま） -->
      <button type="button" id="settings-toggle" class="settings-toggle" aria-label="天気とシャッターの設定" aria-expanded="false" aria-controls="weather-panel" hidden>
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="12" cy="12" r="3" />
          <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z" />
        </svg>
      </button>
    </header>

    <!-- 文字のロゴは、左手前の床の立体の文字（src/floorLogo.js）。見出しは読み上げ用に残す -->
    <section class="hero">
      <h1 class="sr-only">QUIMAGLET OFFICIAL STUDIO</h1>
      <p class="sr-only" id="immerse-desc">IMMERSE を押すと、マウスの動きや端末の傾きで部屋を見回せます。</p>
      <button type="button" id="immerse" class="immerse" aria-pressed="false" aria-describedby="immerse-desc">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M3 8V5a2 2 0 0 1 2-2h3M16 3h3a2 2 0 0 1 2 2v3M21 16v3a2 2 0 0 1-2 2h-3M8 21H5a2 2 0 0 1-2-2v-3" />
          <path d="M2.5 12s3.5-5.5 9.5-5.5 9.5 5.5 9.5 5.5-3.5 5.5-9.5 5.5S2.5 12 2.5 12z" />
          <circle cx="12" cy="12" r="2.6" />
        </svg>
        <span>IMMERSE</span>
      </button>
    </section>

    <button type="button" id="zoom-back" class="zoom-back" hidden>← 戻る</button>

    <!-- お知らせを読んでいる間のボタン（2 台目のロボットが壁に本文を映す。src/main.js） -->
    <nav id="news-nav" class="news-nav" aria-label="お知らせ" hidden>
      <button type="button" data-news-go="prev">← 前の記事</button>
      <button type="button" data-news-go="list">News 一覧</button>
      <button type="button" data-news-go="next">次の記事 →</button>
      <a class="news-nav-link" target="_blank" rel="noopener" hidden>リンク ↗</a>
      <button type="button" class="news-nav-close" data-news-go="close" aria-label="閉じる">×</button>
    </nav>
    <div id="news-sr" class="sr-only" aria-live="polite"></div>

    <div id="tooltip" class="tooltip" hidden></div>

    <!-- Goods の紙のメニューの中身（読み上げとキーボード操作用。見た目は 3D の紙。src/main.js） -->
    <div id="goods-sr" class="sr-only" role="dialog" aria-modal="true" aria-label="Goods" tabindex="-1" hidden></div>

    <div id="panel-scrim" class="panel-scrim" hidden></div>
    <canvas id="holo-beam" class="holo-beam" aria-hidden="true"></canvas>
    <aside id="panel" class="panel" role="dialog" aria-modal="true" aria-labelledby="panel-title" hidden>
      <button type="button" class="panel-close" aria-label="閉じる">×</button>
      <p class="panel-kicker" id="panel-kicker"></p>
      <h2 class="panel-title" id="panel-title"></h2>
      <div class="panel-body" id="panel-body"></div>
    </aside>

  </body>
</html>
